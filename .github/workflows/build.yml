name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.axelbourgeon --project-name axel_lena .
          python3 scripts/patch_android.py

      - name: Install signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::SIGNING_KEYSTORE_B64 absent : APK signé avec une clé temporaire"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk axel-et-lena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: axel-et-lena-apk
          path: axel-et-lena.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: axel-et-lena.apk
          make_latest: true
