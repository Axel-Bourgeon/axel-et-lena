name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.axelbourgeon --project-name axel_lena .
          python3 scripts/patch_android.py

      - name: Install signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::SIGNING_KEYSTORE_B64 absent : APK signé avec une clé temporaire"
          fi

      # Pré-installe le NDK voulu par Flutter, avec plusieurs tentatives :
      # le téléchargement fait par Gradle échoue parfois (archive tronquée).
      - name: Install Android NDK
        run: |
          NDK=$(grep -rhoP 'ndkVersion\s*(:\s*String\s*)?=\s*"\K[0-9.]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle" | head -n1)
          echo "NDK demandé par Flutter : ${NDK:-inconnu}"
          [ -z "$NDK" ] && exit 0
          [ -d "$ANDROID_HOME/ndk/$NDK" ] && exit 0
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/$NDK" "$ANDROID_HOME/.temp"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /tmp/ndk.log 2>&1 && exit 0
            tail -n 5 /tmp/ndk.log
            echo "Tentative $i échouée, nouvel essai dans 20 s"
            sleep 20
          done
          exit 1

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk axel-et-lena.apk

      - uses: actions/upload-artifact@v5
        with:
          name: axel-et-lena-apk
          path: axel-et-lena.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: axel-et-lena.apk
          make_latest: true
