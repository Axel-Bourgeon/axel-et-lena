name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Clé de signature stable (secrets RELEASE_KEYSTORE_*). Sans elle, chaque
      # APK aurait une clé différente et ne s'installerait pas par-dessus.
      - name: Install signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_B64 absent : pas de publication avec une clé temporaire"
            exit 1
          fi

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.axelbourgeon --project-name axel_lena .
          python3 scripts/patch_android.py

      # Pré-installe le NDK voulu par Flutter, avec plusieurs tentatives :
      # le téléchargement fait par Gradle échoue parfois (archive tronquée).
      - name: Install Android NDK
        run: |
          NDK=$(grep -rhoP 'ndkVersion\s*(:\s*String\s*)?=\s*"\K[0-9.]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle" | sort -V | tail -n1)
          echo "NDK demandé par Flutter : ${NDK:-inconnu}"
          [ -z "$NDK" ] && exit 0
          [ -d "$ANDROID_HOME/ndk/$NDK" ] && exit 0
          for i in 1 2 3 4; do
            rm -rf "$ANDROID_HOME/ndk/$NDK" "$ANDROID_HOME/.temp"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /tmp/ndk.log 2>&1 && exit 0
            tail -n 5 /tmp/ndk.log
            echo "Tentative $i échouée, nouvel essai dans 20 s"
            sleep 20
          done
          exit 1

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk axel-et-lena.apk

      # Garde-fou : l'APK publié doit être signé avec la clé attendue.
      - name: Check signature
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          GOT=$("$APKSIGNER" verify --print-certs axel-et-lena.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          WANT=$(tr -d '[:space:]' < scripts/signing_sha256.txt)
          echo "Signature : $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Signature inattendue ($GOT au lieu de $WANT)"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: axel-et-lena-apk
          path: axel-et-lena.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: axel-et-lena.apk
          make_latest: true
