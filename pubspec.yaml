name: axel_lena
description: "Axel & Léna — plateforme de petites applis et de jeux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  photo_manager: ^3.6.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  wakelock_plus: ^1.8.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/words/
    - assets/disque/
    - assets/conseils/
